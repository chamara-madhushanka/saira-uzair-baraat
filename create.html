<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Invitation Link Generator — Saira & Uzair</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 24px 16px;
    background: #faf5ee;
    color: #5c1d2b;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 18px;
  }
  .box {
    max-width: 600px;
    margin: 0 auto;
    background: #fffdf9;
    border: 1.5px solid #c59b49;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 12px 30px rgba(92,29,43,.1);
  }
  h1 {
    font-family: Cinzel, Georgia, serif;
    font-size: 20px;
    text-align: center;
    color: #8e293d;
    margin-top: 0;
  }
  p.desc {
    text-align: center;
    color: #7d535c;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-family: Cinzel, Georgia, serif;
    font-size: 11px;
    letter-spacing: .14em;
    color: #8e293d;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 150px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #c59b49;
    font: inherit;
    background: #fffaf3;
    color: #5c1d2b;
  }
  .btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 1px solid #c59b49;
    border-radius: 999px;
    background: linear-gradient(135deg, #992b40, #6b1b2b);
    color: #fffaf0;
    font-family: Cinzel, Georgia, serif;
    font-size: 12px;
    letter-spacing: .16em;
    cursor: pointer;
  }
  .results {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .item {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid #e5cfa8;
    border-radius: 12px;
    background: #fffaf3;
  }
  .item b { font-size: 19px; color: #5c1d2b; }
  .actions { display: flex; gap: 8px; }
  .sm-btn {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid #c59b49;
    background: #fffdf9;
    color: #8e293d;
    font-family: Cinzel, Georgia, serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    cursor: pointer;
    text-decoration: none;
  }
  .sm-btn.wa {
    background: #25D366;
    border-color: #1ebe5d;
    color: #fff;
  }
</style>
</head>
<body>
<div class="box">
  <h1>Personalised Guest Link Generator</h1>
  <p class="desc">Paste your guest list below (one name per line) to instantly generate personalised wedding invitation links for up to 200+ guests.</p>

  <label for="names">GUEST NAMES (ONE PER LINE)</label>
  <textarea id="names" placeholder="Mr. & Mrs. Ahmed Khan&#10;Dr. Ayesha Siddiqui&#10;Uncle Tariq & Family"></textarea>
  <button class="btn" id="gen">GENERATE PERSONALISED LINKS</button>

  <div class="results" id="out"></div>
</div>

<script>
  var baseUrl = window.location.href.replace(/create\.html.*$/i, "").replace(/\/$/, "");

  document.getElementById("gen").onclick = function() {
    var lines = document.getElementById("names").value.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
    var out = document.getElementById("out");
    out.innerHTML = "";

    if(!lines.length) {
      out.innerHTML = "<p style='text-align:center;color:#8e293d'>Please enter at least one guest name.</p>";
      return;
    }

    lines.forEach(function(name) {
      var link = baseUrl + "/?guest=" + encodeURIComponent(name);
      var waMsg = "Assalamu Alaikum " + name + ",\n\nWith the blessings of Allah, we warmly invite you to the Baraat of Saira Iqbal & Uzair Hussain on 29th December 2026 at Walton View Hotel, Bradford.\n\nPlease open your personal invitation here:\n" + link;
      var waUrl = "https://wa.me/?text=" + encodeURIComponent(waMsg);

      var div = document.createElement("div");
      div.className = "item";
      div.innerHTML = '<div><b>' + name.replace(/</g,"&lt;") + '</b></div>' +
        '<div class="actions">' +
          '<button type="button" class="sm-btn cp">COPY LINK</button>' +
          '<a class="sm-btn wa" target="_blank" rel="noopener" href="' + waUrl + '">WHATSAPP</a>' +
        '</div>';

      div.querySelector(".cp").onclick = function(e) {
        navigator.clipboard.writeText(link);
        e.target.textContent = "COPIED!";
        setTimeout(function(){ e.target.textContent = "COPY LINK"; }, 1500);
      };

      out.appendChild(div);
    });
  };
</script>
</body>
</html>
