<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saira &amp; Uzair — Baraat Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500;1,600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c59b49;
  --gold-light:#ebd197;
  --gold-dark:#8f6319;
  --wine:#581120;
  --wine-deep:#3b0914;
  --rose:#9e2a42;
  --ink:#3d121c;
  --muted:#6e3f49;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  background-color:#2b060e;
  color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,serif;
  font-size:19.5px;
  text-align:center;
  min-height:100vh;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:url('bg.png');
  background-position:center center;
  background-size:cover;
  background-repeat:no-repeat;
  transform:translateZ(0);
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:rgba(43,8,15,0.22);
  pointer-events:none;
}

.frame{max-width:480px;margin:0 auto;padding:18px 14px 110px}

section{
  background:linear-gradient(180deg, rgba(255,253,249,0.95) 0%, rgba(251,243,230,0.92) 100%);
  border:1.5px solid var(--gold);
  border-radius:140px 140px 24px 24px;
  padding:64px 24px 44px;
  margin-bottom:22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  box-shadow:
    0 20px 45px rgba(45,6,12,0.32),
    inset 0 0 0 5px rgba(255,253,249,0.95),
    inset 0 0 0 7px rgba(197,155,73,0.55);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
}

section.hero{
  min-height:84vh;
  background:
    radial-gradient(circle at 50% 18%, rgba(166, 44, 68, 0.55) 0%, transparent 60%),
    radial-gradient(circle at 50% 50%, #6e1527 0%, #470b18 68%, #2e050e 100%);
  color:#fffaf0;
  border:2px solid var(--gold-light);
  border-radius:210px 210px 28px 28px;
  padding:46px 22px 34px;
  justify-content:center;
  gap:6px;
  box-shadow:
    0 26px 65px rgba(32, 3, 10, 0.65),
    inset 0 0 0 6px #3b0813,
    inset 0 0 0 7.5px var(--gold),
    inset 0 0 40px rgba(0, 0, 0, 0.45);
}

section.hero::after{
  content:"";
  position:absolute;
  inset:12px;
  border-radius:198px 198px 20px 20px;
  background-image:radial-gradient(circle at 50% 32%, rgba(235, 209, 151, 0.08) 1px, transparent 1px);
  background-size:22px 22px;
  pointer-events:none;
  z-index:0;
}
section.hero > *{position:relative;z-index:1;max-width:100%}

.hero-crown{
  color:var(--gold-light);
  opacity:0.9;
  margin-bottom:0;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}

.gold-foil{
  background:linear-gradient(120deg, #c9973e 0%, #f7e3b2 30%, #d4a64a 55%, #fff2cf 78%, #b88428 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldShimmer 4.5s linear infinite;
}
@keyframes goldShimmer{to{background-position:220% center}}

.ia .gold-foil, section:not(.hero) .gold-foil{
  background:linear-gradient(120deg, #75182b 0%, #b88228 32%, #631122 58%, #c99332 82%, #75182b 100%);
  background-size:220% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:none;
}

.bismillah{
  font-family:"Amiri",serif;
  font-size:29px;
  font-weight:700;
  margin:0 0 2px;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));
}

.guest-pill{
  display:inline-block;
  padding:5px 20px;
  border:1px solid rgba(235,209,151,0.6);
  border-radius:999px;
  background:linear-gradient(180deg, rgba(255,250,240,0.12), rgba(255,250,240,0.04));
  font-family:"Cormorant Garamond",Georgia,serif;
  font-style:italic;
  font-size:18.5px;
  font-weight:600;
  color:var(--gold-light);
  margin:2px 0 4px;
  box-shadow:0 4px 16px rgba(0,0,0,0.22);
}

h2,h3,.cap{font-family:"Cinzel",Georgia,serif;margin:0;text-align:center}
h2{
  font-family:"Cinzel Decorative","Cinzel",Georgia,serif;
  font-size:20.5px;
  line-height:1.35;
  letter-spacing:.08em;
  margin:4px auto 14px;
  color:var(--wine);
  max-width:340px;
}
h3{font-size:16px;letter-spacing:.12em;margin:0 0 6px;color:var(--rose)}

.cap{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.26em;
  color:var(--gold-dark);
  text-transform:uppercase;
  margin:6px auto;
  max-width:340px;
}
.hero .cap{color:var(--gold-light);opacity:0.95;margin:4px auto 2px}

.hero-names-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:4px auto;
  padding:4px 0;
}

.hero-divider{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:150px;
  margin:2px auto;
  opacity:0.75;
}
.hero-divider::before,
.hero-divider::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-light));
}
.hero-divider::after{
  background:linear-gradient(270deg, transparent, var(--gold-light));
}
.hero-divider i{
  display:block;
  width:6px;
  height:6px;
  transform:rotate(45deg);
  background:var(--gold-light);
}

.names{
  font-family:"Great Vibes",cursive;
  font-size:54px;
  line-height:1.1;
  margin:6px auto;
  padding:4px 8px;
  max-width:100%;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.45));
}
.hero .names{
  font-size:66px;
  line-height:1.06;
  margin:2px auto;
  padding:2px 12px;
}
.hero .names .hero-amp{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-style:italic;
  font-size:22px;
  line-height:1.1;
  display:block;
  margin:2px auto;
  color:#f9e8c9;
  -webkit-text-fill-color:#f9e8c9;
}
.names .bridge{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-style:italic;
  font-size:18px;
  line-height:1.35;
  letter-spacing:0.03em;
  display:block;
  margin:6px auto;
  max-width:300px;
  color:#f9e8c9;
  -webkit-text-fill-color:#f9e8c9;
}

.closing-names{
  font-size:52px;
  line-height:1.08;
  margin:10px auto 4px;
  padding:4px 10px;
  filter:none;
}
.closing-names .amp{
  font-family:"Cormorant Garamond",Georgia,serif;
  font-style:italic;
  font-size:21px;
  line-height:1.2;
  display:block;
  margin:4px auto;
  color:var(--rose);
  -webkit-text-fill-color:var(--rose);
}

.hero-datebox{
  width:100%;
  max-width:340px;
  margin:6px auto 0;
  border-top:1px solid rgba(235,209,151,0.6);
  border-bottom:1px solid rgba(235,209,151,0.6);
  padding:10px 14px;
  background:linear-gradient(90deg, transparent, rgba(0,0,0,0.24), transparent);
}
.hero-datebox .d-main{
  font-family:"Cinzel",Georgia,serif;
  font-size:13px;
  font-weight:700;
  letter-spacing:.15em;
  color:var(--gold-light);
  display:block;
  line-height:1.4;
}
.hero-datebox .d-time{
  font-family:"Cinzel",Georgia,serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.18em;
  color:#f7e7ce;
  display:block;
  margin-top:4px;
  line-height:1.4;
}

.bigdate{
  width:100%;
  max-width:340px;
  font-family:"Cinzel",Georgia,serif;
  font-size:13px;
  font-weight:700;
  line-height:1.55;
  letter-spacing:.15em;
  color:var(--wine);
  border-top:1px solid var(--gold);
  border-bottom:1px solid var(--gold);
  padding:11px 14px;
  margin:14px auto;
  background:rgba(197,155,73,0.08);
}

.subvenue{
  font-size:17.5px;
  line-height:1.35;
  color:#f3dec0;
  margin:6px auto 0;
  max-width:330px;
  font-style:italic;
  letter-spacing:0.03em;
}

.scroll-cue{
  margin:10px auto 0;
  font-family:"Cinzel",Georgia,serif;
  font-size:9px;
  letter-spacing:.26em;
  color:var(--gold-light);
  opacity:0.75;
  text-transform:uppercase;
  animation:pulseDown 2s ease-in-out infinite;
}
@keyframes pulseDown{
  0%,100%{transform:translateY(0);opacity:0.65}
  50%{transform:translateY(4px);opacity:1}
}

p{margin:8px auto;line-height:1.65;max-width:350px}
.muted{color:var(--muted)}

.invite-lead{
  width:100%;
  max-width:340px;
  font-family:"Cinzel",Georgia,serif;
  font-size:12.5px;
  font-weight:700;
  letter-spacing:.13em;
  color:var(--rose);
  line-height:1.65;
  margin:4px auto 14px;
  padding-bottom:12px;
  border-bottom:1px dashed rgba(197,155,73,0.55);
}
.invite-body{
  width:100%;
  max-width:345px;
  font-size:19px;
  line-height:1.68;
  color:var(--ink);
  margin:6px auto;
}
.invite-highlight{
  width:100%;
  max-width:340px;
  font-family:"Cinzel Decorative","Cinzel",Georgia,serif;
  font-size:20px;
  line-height:1.35;
  font-weight:700;
  color:var(--wine);
  margin:6px auto;
  letter-spacing:0.06em;
}
.invite-dua{
  width:100%;
  max-width:340px;
  font-style:italic;
  font-weight:600;
  font-size:19.5px;
  line-height:1.55;
  color:var(--rose);
  margin:14px auto 0;
}

.count{display:flex;justify-content:center;gap:10px;margin:14px auto;max-width:100%}
.count div{
  border:1.5px solid var(--gold);
  border-radius:46px 46px 14px 14px;
  padding:15px 8px 11px;
  min-width:66px;
  background:linear-gradient(180deg, #fffdf9 0%, #f5e5cb 100%);
}
.count b{display:block;font-family:"Cinzel",Georgia,serif;font-size:24px;color:var(--wine)}
.count small{font-size:9.5px;font-weight:700;letter-spacing:.15em;color:var(--gold-dark);text-transform:uppercase}

.ev{
  width:100%;
  max-width:360px;
  border:1.5px solid var(--gold);
  border-radius:70px 70px 16px 16px;
  padding:26px 18px 20px;
  margin:0 auto 14px;
  background:linear-gradient(180deg, #fffdf9 0%, #f8ebd8 100%);
}

.btn{
  display:inline-block;
  margin-top:16px;
  padding:14px 28px;
  border-radius:999px;
  border:1.5px solid var(--gold-light);
  background:linear-gradient(135deg, #8e243a 0%, #591120 100%);
  color:#fff8eb;
  text-decoration:none;
  font-family:"Cinzel",Georgia,serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:.18em;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(89,17,32,0.3);
  position:relative;
  overflow:hidden;
}
.btn::after{
  content:"";
  position:absolute;
  top:0;left:-65%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,236,192,0.55),transparent);
  transform:skewX(-22deg);
  animation:shine 3.2s ease-in-out infinite;
}
@keyframes shine{0%,55%{left:-65%}100%{left:135%}}

form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;margin:10px auto 0}
input,select,textarea{
  width:100%;
  padding:13px 14px;
  border-radius:14px;
  border:1px solid var(--gold);
  background:#fffdf9;
  color:var(--ink);
  font:inherit;
}
textarea{min-height:84px;resize:vertical}
label{text-align:left;font-family:"Cinzel",Georgia,serif;font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--wine)}

.music-btn{
  position:fixed;
  top:calc(16px + env(safe-area-inset-top,0px));
  right:16px;
  z-index:20;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1.5px solid var(--gold-light);
  background:rgba(68,12,24,0.92);
  color:var(--gold-light);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(32,3,10,0.45);
  backdrop-filter:blur(8px);
  transition:transform 0.2s ease;
}
.music-btn:active{transform:scale(0.92)}
.music-btn.playing{animation:spinSlow 8s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}

nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(440px,calc(100% - 26px));
  display:flex;
  justify-content:space-around;
  background:rgba(68,12,24,0.96);
  border:1.5px solid var(--gold);
  border-radius:999px;
  padding:11px 8px;
  box-shadow:0 12px 32px rgba(45,8,16,0.38);
  backdrop-filter:blur(10px);
  z-index:10;
}
nav a{color:var(--gold-light);text-decoration:none;font-family:"Cinzel",Georgia,serif;font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 6px;text-transform:uppercase}

.hero>*{opacity:0}
body.go .hero>*{animation:up 1.15s cubic-bezier(.2,.7,.2,1) both}
body.go .hero>*:nth-child(1){animation-delay:.08s}
body.go .hero>*:nth-child(2){animation-delay:.2s}
body.go .hero>*:nth-child(3){animation-delay:.35s}
body.go .hero>*:nth-child(4){animation-delay:.5s}
body.go .hero>*:nth-child(5){animation-delay:.68s}
body.go .hero>*:nth-child(6){animation-delay:.85s}
body.go .hero>*:nth-child(7){animation-delay:1s}
body.go .hero>*:nth-child(8){animation-delay:1.15s}
@keyframes up{from{opacity:0;transform:translateY(22px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

.rv>*{position:relative;z-index:1;opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in>*{opacity:1;transform:none}
.rv.in>*:nth-child(2){transition-delay:.1s}
.rv.in>*:nth-child(3){transition-delay:.2s}
.rv.in>*:nth-child(4){transition-delay:.3s}
.rv.in>*:nth-child(5){transition-delay:.4s}
.rv.in>*:nth-child(6){transition-delay:.5s}

.motif{color:var(--gold);margin:0 auto 6px;display:flex;justify-content:center}
.motif path{stroke-dasharray:220;stroke-dashoffset:220;transition:stroke-dashoffset 2.2s ease .2s}
.in .motif path{stroke-dashoffset:0}
#cs{animation:beat 1s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.16);color:var(--rose)}}

.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.petals i{
  position:absolute;top:0;
  border-radius:65% 0 65% 0;
  background:linear-gradient(135deg, #c95b71 0%, #821d32 100%);
  opacity:.52;
  animation:fall linear infinite,sway ease-in-out infinite alternate;
}
.petals i.spark{
  border-radius:50%;
  background:radial-gradient(circle, #fff6d6 0%, #d9ab52 70%, transparent 100%);
  box-shadow:0 0 8px #f5dfa8;
  opacity:.75;
}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
@keyframes sway{from{translate:-20px 0}to{translate:20px 0}}

.intro{
  position:fixed;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  background-color:#3b0914;
  background-image:linear-gradient(rgba(43,8,15,0.18), rgba(43,8,15,0.18)), url('bg.png');
  background-size:cover;
  background-position:center center;
  transition:opacity 1.1s ease,transform 1.25s cubic-bezier(.2,.7,.2,1),filter 1s ease;
}
.ia{
  position:relative;
  width:min(340px,86vw);
  border:2px solid var(--gold);
  border-radius:170px 170px 26px 26px;
  background:linear-gradient(180deg, rgba(255,253,249,0.97) 0%, rgba(247,234,213,0.95) 100%);
  color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px 38px;
  animation:float 4.8s ease-in-out infinite alternate;
  box-shadow:
    0 24px 60px rgba(0,0,0,0.45),
    inset 0 0 0 5px #fffdf9,
    inset 0 0 0 6.5px var(--gold);
}
.ia .bismillah{font-size:24px;filter:none}
.ia .guest-pill{
  background:rgba(107,24,41,0.08);
  border-color:var(--gold);
  color:var(--wine);
  font-size:17.5px;
  box-shadow:none;
}
.ia .names{font-size:42px;margin:6px 0;filter:none}
.ia .names .bridge{
  font-size:16px;
  color:var(--rose);
  -webkit-text-fill-color:var(--rose);
  margin:4px auto;
}
.intro.open{opacity:0;transform:scale(1.16);filter:blur(8px);pointer-events:none}
html.lock{overflow:hidden}
@keyframes float{from{transform:translateY(-6px)}to{transform:translateY(6px)}}

[hidden]{display:none!important}
.rl{max-width:340px;margin:6px auto 4px}
.rsum{width:100%;max-width:340px;display:flex;flex-direction:column;gap:3px;margin:14px auto 6px;padding:13px 14px;border:1px solid var(--gold);border-radius:14px;background:#fffdf9}
.rsum b{font-family:"Cinzel",Georgia,serif;font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--wine)}
.rsum span{font-size:16px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;flex:1 1 130px;margin:0;text-align:center;font:inherit;letter-spacing:0;color:var(--ink);cursor:pointer}
.opt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;cursor:pointer}
.opt span{display:block;padding:11px 12px;border:1px solid var(--gold);border-radius:999px;background:#fffdf9;font-size:17px;font-weight:600;line-height:1.2;transition:all .25s}
.opt input:checked+span{background:linear-gradient(135deg, #8e243a, #591120);border-color:var(--gold-light);color:#fff8eb}
#yes{display:flex;flex-direction:column;gap:12px}
.step{display:flex;align-items:center;justify-content:center;gap:18px}
.step button{width:42px;height:42px;padding:0;border-radius:50%;border:1px solid var(--gold);background:#fffdf9;color:var(--wine);font-size:22px;line-height:1;cursor:pointer}
.step output{min-width:42px;font-family:"Cinzel",Georgia,serif;font-size:22px;font-weight:700;text-align:center;color:var(--wine)}
.rh{font-size:15px;margin:2px auto 0}
#ty{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;margin:10px auto 0}
#ty h3{margin:6px 0}
.lnk{margin-top:14px;padding:4px;background:none;border:0;color:var(--muted);font:inherit;font-size:16px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<button type="button" id="mbtn" class="music-btn" aria-label="Toggle Music" title="Play / Pause Music" hidden>
  <svg id="micon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"></path>
    <circle cx="6" cy="18" r="3"></circle>
    <circle cx="18" cy="16" r="3"></circle>
  </svg>
</button>

<div class="frame" id="app"></div>
<nav>
  <a href="#home">Home</a>
  <a href="#message">Invite</a>
  <a href="#events">Baraat</a>
  <a href="#venue">Venue</a>
  <a href="#rsvp">RSVP</a>
</nav>

<script>
var CONFIG = {
  bride: "Saira Iqbal",
  groom: "Uzair Hussain",

  weddingDate: "2026-12-29",
  eventTime: "17:00",
  eventTimeRange: "5:00 PM – 10:00 PM",

  inviteHeadline: "A BEAUTIFUL BEGINNING, A LOVE TO LAST A LIFETIME",
  inviteIntro: "With hearts full of love and gratitude, and the blessings of Allah, we warmly invite you to join us in celebrating the Baraat of our beloved",
  inviteBridge: "as she begins a beautiful new chapter with",
  inviteParagraph1: "A day woven with love, cherished traditions and treasured moments.",
  inviteParagraph2: "Your presence would mean the world to us as we gather our loved ones to celebrate this beautiful union and surround the newlyweds with happiness, blessings and duas for a lifetime of love.",
  inviteSignOff: "With love, and a lifetime of duas for their happiness.",

  events: [
    { name: "Baraat Ceremony & Reception", date: "2026-12-29", timeRange: "5:00 PM – 10:00 PM" }
  ],

  venueName: "Walton View Hotel",
  venuePostcode: "BD4 0RY",
  venueCityRegion: "Bradford, West Yorkshire, UK",
  mapQuery: "Walton View Hotel BD4 0RY Bradford",

  rsvpMessage: "Your presence would mean the world to us. Please let us know if you can join the celebration.",
  rsvpMaxGuests: 10,
  rsvpWhatsApp: "447988707891",
  closing: "We look forward to celebrating this blessed occasion with you."
};

(function(){
  var params = new URLSearchParams(window.location.search);
  var rawGuest = params.get("guest") || params.get("to") || params.get("name") || "";
  var guestName = rawGuest.trim();
  var greetingText = guestName ? ("Dear " + guestName + ",") : "Dear Honoured Guest,";

  var C = CONFIG;
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function ord(n){var s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
  function parse(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
  function fmt(d,short){var x=parse(d);if(!x)return "Date to be announced";return (short?"":DAYS[x.getDay()]+", ")+ord(x.getDate())+" "+MONTHS[x.getMonth()]+" "+x.getFullYear();}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function noBreakPostcode(pc){return esc(String(pc||"").trim()).replace(/\s+/g,"\u00A0");}

  var fullVenue = C.venueName + ", " + C.venuePostcode + ", " + C.venueCityRegion;
  var shortVenueLine = C.venueName + ", Bradford · " + noBreakPostcode(C.venuePostcode);
  var stackedVenueHTML = esc(C.venueName.toUpperCase()) + "<br>" + esc("BRADFORD") + " · " + noBreakPostcode(C.venuePostcode.toUpperCase());

  var wd = parse(C.weddingDate);
  var big = wd ? ("TUESDAY " + ord(wd.getDate()).toUpperCase() + " " + MONTHS[wd.getMonth()].toUpperCase() + " " + wd.getFullYear()) : "DATE TO BE ANNOUNCED";

  var crownSVG = '<svg class="hero-crown" viewBox="0 0 160 44" width="125" fill="none" stroke="currentColor" stroke-width="1.2">' +
    '<path d="M20 38 C50 38, 65 24, 80 8 C95 24, 110 38, 140 38"/>' +
    '<path d="M42 38 C60 36, 70 26, 80 15 C90 26, 100 36, 118 38" stroke-opacity="0.6"/>' +
    '<polygon points="80,2 84,8 80,14 76,8" fill="currentColor"/>' +
    '<circle cx="80" cy="26" r="2.2" fill="currentColor"/>' +
    '<circle cx="52" cy="33" r="1.6" fill="currentColor"/>' +
    '<circle cx="108" cy="33" r="1.6" fill="currentColor"/>' +
  '</svg>';

  var ornamentSVG = '<svg viewBox="0 0 180 34" width="135" fill="none" stroke="currentColor" stroke-width="1.3">' +
    '<path d="M10 17 C35 4, 60 30, 90 17 C120 4, 145 30, 170 17"/>' +
    '<path d="M10 17 C35 30, 60 4, 90 17 C120 30, 145 4, 170 17"/>' +
    '<polygon points="90,9 97,17 90,25 83,17" fill="currentColor"/>' +
    '<circle cx="48" cy="17" r="2.2" fill="currentColor"/>' +
    '<circle cx="132" cy="17" r="2.2" fill="currentColor"/>' +
  '</svg>';

  var h = '';

  h += '<section id="home" class="hero">' +
    crownSVG +
    '<div class="bismillah gold-foil">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</div>' +
    '<div class="guest-pill">' + esc(greetingText) + '</div>' +
    '<div class="cap">With the Blessings of Allah</div>' +
    '<div class="hero-names-wrap">' +
      '<div class="hero-divider"><i></i></div>' +
      '<div class="names gold-foil">' +
        'Saira' +
        '<span class="hero-amp">&amp;</span>' +
        'Uzair' +
      '</div>' +
      '<div class="hero-divider"><i></i></div>' +
    '</div>' +
    '<div class="hero-datebox">' +
      '<span class="d-main">' + esc(big) + '</span>' +
      '<span class="d-time">' + esc(C.eventTimeRange.toUpperCase()) + ' · BARAAT</span>' +
    '</div>' +
    '<div class="subvenue">' + shortVenueLine + '</div>' +
    '<div class="scroll-cue">Scroll Down ↓</div>' +
  '</section>';

  h += '<section id="message">' +
    '<div class="cap">Baraat Invitation</div>' +
    '<h2>With Love &amp; Gratitude</h2>' +
    '<p class="invite-lead">' + esc(C.inviteHeadline) + '</p>' +
    '<p class="invite-body">' + esc(C.inviteIntro) + '</p>' +
    '<div class="invite-highlight">' + esc(C.bride.toUpperCase()) + '</div>' +
    '<p class="invite-body" style="font-style:italic;margin:2px auto">' + esc(C.inviteBridge) + '</p>' +
    '<div class="invite-highlight">' + esc(C.groom.toUpperCase()) + '</div>' +
    '<div class="bigdate">' + esc(big) + '<br><span style="font-size:11px;letter-spacing:.14em">' + esc(C.eventTimeRange.toUpperCase()) + '</span><br><span style="font-size:11px;letter-spacing:.14em">' + stackedVenueHTML + '</span></div>' +
    '<p class="invite-body">' + esc(C.inviteParagraph1) + '</p>' +
    '<p class="invite-body">' + esc(C.inviteParagraph2) + '</p>' +
    '<p class="invite-dua">' + esc(C.inviteSignOff) + '</p>' +
  '</section>';

  if(wd){
    h += '<section id="count">' +
      '<div class="cap">The blessed day awaits</div>' +
      '<h2>Counting Down</h2>' +
      '<div class="count">' +
        '<div><b id="cd">0</b><small>Days</small></div>' +
        '<div><b id="ch">0</b><small>Hours</small></div>' +
        '<div><b id="cm">0</b><small>Mins</small></div>' +
        '<div><b id="cs">0</b><small>Secs</small></div>' +
      '</div>' +
    '</section>';
  }

  h += '<section id="events">' +
    '<div class="cap">Celebrate with us</div>' +
    '<h2>The Baraat</h2>' +
    C.events.map(function(e){
      return '<div class="ev"><h3>' + esc(e.name) + '</h3><p><b>' + esc(fmt(e.date,false)) + '</b></p><p><b>' + esc(e.timeRange || C.eventTimeRange) + '</b></p><p class="muted">' + esc(fullVenue) + '</p></div>';
    }).join('');

  if(wd){
    var p = function(n){return (n<10?"0":"")+n;};
    var ds = wd.getFullYear()+p(wd.getMonth()+1)+p(wd.getDate());
    var nx = new Date(wd.getTime()+86400000);
    var de = nx.getFullYear()+p(nx.getMonth()+1)+p(nx.getDate());
    h += '<a class="btn" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(C.bride + " & " + C.groom + " Baraat") + '&dates=' + ds + '/' + de + '&location=' + encodeURIComponent(fullVenue) + '">SAVE TO CALENDAR</a>';
  }
  h += '</section>';

  h += '<section id="venue">' +
    '<div class="cap">The Setting</div>' +
    '<h2>Wedding Venue</h2>' +
    '<h3>' + esc(C.venueName) + '</h3>' +
    '<p class="muted">' + noBreakPostcode(C.venuePostcode) + ", " + esc(C.venueCityRegion) + '</p>' +
    '<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(C.mapQuery) + '">VIEW ON GOOGLE MAPS</a>' +
  '</section>';

  h += '<section id="rsvp">' +
    '<div class="cap">Kindly Reply</div>' +
    '<h2>Will You Join Us?</h2>' +
    '<p class="rl">' + esc(C.rsvpMessage) + '</p>' +
    '<div class="rsum"><b>' + esc(fmt(C.weddingDate)) + ' · ' + esc(C.eventTimeRange) + '</b><span>' + shortVenueLine + '</span></div>' +
    '<form id="f">' +
      '<label for="fn">GUEST FULL NAME</label>' +
      '<input id="fn" required autocomplete="name" value="' + esc(guestName) + '" placeholder="Enter your full name">' +
      '<label id="lt">WILL YOU BE ATTENDING?</label>' +
      '<div class="opts" role="radiogroup" aria-labelledby="lt">' +
        '<label class="opt"><input type="radio" name="fa" value="yes" checked><span>Joyfully accept</span></label>' +
        '<label class="opt"><input type="radio" name="fa" value="no"><span>Regretfully decline</span></label>' +
      '</div>' +
      '<div id="yes">' +
        '<label id="lg">NUMBER OF GUESTS (INCLUDING YOU)</label>' +
        '<div class="step" role="group" aria-labelledby="lg">' +
          '<button type="button" id="gm" aria-label="Fewer guests">&minus;</button>' +
          '<output id="go" aria-live="polite">1</output>' +
          '<button type="button" id="gp" aria-label="More guests">+</button>' +
        '</div>' +
      '</div>' +
      '<label for="fnote">DUAS OR MESSAGE FOR THE COUPLE (OPTIONAL)</label>' +
      '<textarea id="fnote" maxlength="300" placeholder="Write a blessing or wish for Saira & Uzair"></textarea>' +
      '<button class="btn" type="submit">SEND RSVP VIA WHATSAPP</button>' +
      '<p class="muted rh">Your reply opens in WhatsApp, ready to send.</p>' +
      '<p class="muted" id="fm" role="status"></p>' +
    '</form>' +
    '<div id="ty" hidden></div>' +
  '</section>';

  /* Save The Date / Closing section: Saira & Uzair */
  h += '<section>' +
    '<div class="motif">' + ornamentSVG + '</div>' +
    '<div class="cap">Save The Date</div>' +
    '<div class="bigdate">' + esc(big) + '<br><span style="font-size:11px;letter-spacing:.14em">' + esc(C.eventTimeRange.toUpperCase()) + '</span><br><span style="font-size:11px;letter-spacing:.14em">' + stackedVenueHTML + '</span></div>' +
    '<p style="margin-top:16px">' + esc(C.closing) + '</p>' +
    '<div class="names gold-foil closing-names">' +
      'Saira' +
      '<span class="amp">&amp;</span>' +
      'Uzair' +
    '</div>' +
  '</section>';

  document.getElementById("app").innerHTML = h;

  var bgm = document.getElementById("bgm");
  var mbtn = document.getElementById("mbtn");
  var micon = document.getElementById("micon");
  var iconPlay = '<path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle>';
  var iconMute = '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle>';

  function setMusicState(isPlaying){
    mbtn.hidden = false;
    if(isPlaying){
      mbtn.classList.add("playing");
      micon.innerHTML = iconPlay;
    } else {
      mbtn.classList.remove("playing");
      micon.innerHTML = iconMute;
    }
  }

  mbtn.onclick = function(){
    if(bgm.paused){
      bgm.play().then(function(){ setMusicState(true); }).catch(function(){});
    } else {
      bgm.pause();
      setMusicState(false);
    }
  };

  var f = document.getElementById("f"), ty = document.getElementById("ty"), fm = document.getElementById("fm"), yes = document.getElementById("yes"), go = document.getElementById("go"), gc = 1, MG = Math.max(1, +C.rsvpMaxGuests || 10);
  function ans(){ return f.querySelector('input[name="fa"]:checked').value; }
  [].forEach.call(f.querySelectorAll('input[name="fa"]'), function(r){
    r.addEventListener("change", function(){ yes.hidden = ans() !== "yes"; });
  });
  document.getElementById("gm").onclick = function(){ gc = Math.max(1, gc - 1); go.textContent = gc; };
  document.getElementById("gp").onclick = function(){ gc = Math.min(MG, gc + 1); go.textContent = gc; };

  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    fm.textContent = "";
    var name = document.getElementById("fn").value.trim();
    var ok = ans() === "yes";
    var note = document.getElementById("fnote").value.trim();
    if(!name){ fm.textContent = "Please enter your name."; return; }

    var L = [
      "💌 *Baraat RSVP – " + C.bride + " & " + C.groom + "*",
      "",
      "👤 *Guest Name:* " + name,
      ok ? "✅ *Response:* Joyfully accept" : "💔 *Response:* Regretfully decline"
    ];
    if(ok){ L.push("👥 *Total Guests:* " + gc); }
    if(note){ L.push("", "🤲 *Message / Dua:* " + note); }

    var url = "https://wa.me/" + C.rsvpWhatsApp + "?text=" + encodeURIComponent(L.join("\n"));
    ty.innerHTML = '<div class="motif">' + ornamentSVG + '</div><h3>JazakAllah Khair, ' + esc(name.split(/\s+/)[0]) + '!</h3><p>' + (ok ? 'We look forward to welcoming you to the Baraat.' : 'Thank you for letting us know. You will be remembered in our duas.') + '</p><p class="muted">Please tap below if WhatsApp did not open automatically:</p><a class="btn" target="_blank" rel="noopener" href="' + esc(url) + '">SEND ON WHATSAPP</a><button type="button" class="lnk" id="ed">Edit my RSVP</button>';
    f.hidden = true;
    ty.hidden = false;
    document.getElementById("ed").onclick = function(){ ty.hidden = true; f.hidden = false; };
    window.open(url, "_blank");
    ty.scrollIntoView({block:"center"});
  });

  if(wd){
    var q = C.eventTime.split(":");
    var target = new Date(wd.getFullYear(), wd.getMonth(), wd.getDate(), +q[0], +q[1]).getTime();
    function tick(){
      var s = Math.max(0, Math.floor((target - Date.now()) / 1000));
      document.getElementById("cd").textContent = Math.floor(s / 86400);
      document.getElementById("ch").textContent = Math.floor(s % 86400 / 3600);
      document.getElementById("cm").textContent = Math.floor(s % 3600 / 60);
      document.getElementById("cs").textContent = s % 60;
    }
    tick();
    setInterval(tick, 1000);
  }

  var B = document.body, H = document.documentElement;
  var secs = [].slice.call(document.querySelectorAll("section:not(.hero)"));
  secs.forEach(function(s){
    s.classList.add("rv");
    if(s.querySelector("h2")) s.insertAdjacentHTML("afterbegin", '<div class="motif">' + ornamentSVG + '</div>');
  });

  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, {threshold:.12});
    secs.forEach(function(s){ io.observe(s); });
  } else {
    secs.forEach(function(s){ s.classList.add("in"); });
  }

  var P = document.createElement("div");
  P.className = "petals";
  for(var i = 0; i < 22; i++){
    var p = document.createElement("i");
    var isSpark = i % 3 === 0;
    if(isSpark) p.className = "spark";
    var z = isSpark ? (4 + Math.random() * 5) : (8 + Math.random() * 9);
    p.style.cssText = "left:" + (Math.random()*100) + "%;width:" + z + "px;height:" + (isSpark ? z : z*1.2) + "px;animation-duration:" + (12+Math.random()*12) + "s," + (3+Math.random()*3) + "s;animation-delay:-" + (Math.random()*20) + "s,0s";
    P.appendChild(p);
  }
  B.appendChild(P);

  if(location.hash){
    B.classList.add("go");
    setMusicState(false);
  } else {
    H.classList.add("lock");
    var O = document.createElement("div"); O.className = "intro";
    var a = document.createElement("div"); a.className = "ia";

    var bis = document.createElement("div");
    bis.className = "bismillah gold-foil";
    bis.textContent = "بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم";

    var gb = document.createElement("div");
    gb.className = "guest-pill";
    gb.textContent = greetingText;

    var c = document.createElement("div");
    c.className = "cap";
    c.textContent = "Baraat Invitation";

    var n = document.createElement("div");
    n.className = "names gold-foil";
    n.innerHTML = 'Saira<span class="bridge">' + esc(C.inviteBridge) + '</span>Uzair';

    var openBtn = document.createElement("button");
    openBtn.type = "button";
    openBtn.className = "btn";
    openBtn.textContent = "OPEN INVITATION";

    var sub = document.createElement("div");
    sub.className = "intro-sub";
    sub.textContent = "Tap to Unfold";

    openBtn.onclick = function(){
      O.classList.add("open");
      H.classList.remove("lock");
      B.classList.add("go");
      bgm.play().then(function(){
        setMusicState(true);
      }).catch(function(){
        setMusicState(false);
      });
      setTimeout(function(){ O.remove(); }, 1250);
    };

    a.appendChild(bis);
    a.appendChild(gb);
    a.appendChild(c);
    a.appendChild(n);
    a.appendChild(openBtn);
    a.appendChild(sub);
    O.appendChild(a);
    B.appendChild(O);
  }
})();
</script>
</body>
